<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
  <title id="title">Serein Alabaster and Obsidian color palettes</title>
  <desc id="description">Two palettes with canvas, surface, text, accent, success, warning, and error colors.</desc>
  <rect width="1000" height="360" rx="20" fill="#F6F4F0"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="16" y="16" width="476" height="328" rx="16" fill="#FFFFFF" stroke="#E3DFD7"/>
    <text x="40" y="58" fill="#3D3A36" font-size="24" font-weight="700">Alabaster</text>
    <text x="40" y="83" fill="#5C5852" font-size="14">Soft ivory, stone and muted berry</text>

    <g>
      <rect x="40" y="112" width="52" height="80" rx="9" fill="#F6F4F0" stroke="#E3DFD7"/>
      <rect x="102" y="112" width="52" height="80" rx="9" fill="#EDEAE4"/>
      <rect x="164" y="112" width="52" height="80" rx="9" fill="#3D3A36"/>
      <rect x="226" y="112" width="52" height="80" rx="9" fill="#914854"/>
      <rect x="288" y="112" width="52" height="80" rx="9" fill="#405D3D"/>
      <rect x="350" y="112" width="52" height="80" rx="9" fill="#705711"/>
      <rect x="412" y="112" width="52" height="80" rx="9" fill="#963D37"/>
    </g>
    <g fill="#5C5852" font-size="10">
      <text x="40" y="216">Canvas</text><text x="40" y="235">#F6F4F0</text>
      <text x="102" y="216">Surface</text><text x="102" y="235">#EDEAE4</text>
      <text x="164" y="216">Text</text><text x="164" y="235">#3D3A36</text>
      <text x="226" y="216">Accent</text><text x="226" y="235">#914854</text>
      <text x="288" y="216">Success</text><text x="288" y="235">#405D3D</text>
      <text x="350" y="216">Warning</text><text x="350" y="235">#705711</text>
      <text x="412" y="216">Error</text><text x="412" y="235">#963D37</text>
    </g>
    <text x="40" y="298" fill="#914854" font-size="15" font-weight="600">A calm light workspace</text>

    <rect x="508" y="16" width="476" height="328" rx="16" fill="#191817"/>
    <text x="532" y="58" fill="#C7C3BA" font-size="24" font-weight="700">Obsidian</text>
    <text x="532" y="83" fill="#A39E95" font-size="14">Warm charcoal, soft cream and dusty rose</text>

    <g>
      <rect x="532" y="112" width="52" height="80" rx="9" fill="#191817" stroke="#2B2926"/>
      <rect x="594" y="112" width="52" height="80" rx="9" fill="#21201E"/>
      <rect x="656" y="112" width="52" height="80" rx="9" fill="#C7C3BA"/>
      <rect x="718" y="112" width="52" height="80" rx="9" fill="#C9848F"/>
      <rect x="780" y="112" width="52" height="80" rx="9" fill="#9FAE94"/>
      <rect x="842" y="112" width="52" height="80" rx="9" fill="#BAA16B"/>
      <rect x="904" y="112" width="52" height="80" rx="9" fill="#CF8179"/>
    </g>
    <g fill="#A39E95" font-size="10">
      <text x="532" y="216">Canvas</text><text x="532" y="235">#191817</text>
      <text x="594" y="216">Surface</text><text x="594" y="235">#21201E</text>
      <text x="656" y="216">Text</text><text x="656" y="235">#C7C3BA</text>
      <text x="718" y="216">Accent</text><text x="718" y="235">#C9848F</text>
      <text x="780" y="216">Success</text><text x="780" y="235">#9FAE94</text>
      <text x="842" y="216">Warning</text><text x="842" y="235">#BAA16B</text>
      <text x="904" y="216">Error</text><text x="904" y="235">#CF8179</text>
    </g>
    <text x="532" y="298" fill="#C9848F" font-size="15" font-weight="600">A softer dark workspace</text>
  </g>
</svg>
